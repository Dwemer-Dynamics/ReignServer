name: Reign channels and Linux build
on:
  pull_request:
    branches: [unstable, dev, reign]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify promotion path
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$TARGET_BRANCH" in
            dev) test "$SOURCE_BRANCH" = unstable ;;
            reign) test "$SOURCE_BRANCH" = dev ;;
            unstable) : ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build public Linux server
        run: python3 scripts/Build-Linux.py --output "$RUNNER_TEMP/reign-linux"
